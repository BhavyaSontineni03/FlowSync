# FlowSync Option A: 2 API replicas behind local nginx (least_conn).
# Listen :8080 → upstream 127.0.0.1:8081 + :8082
#
# Start (from repo root):
#   nginx -c "$(pwd)/load-test/nginx/nginx-hotpath-lb.conf" -p "$(pwd)/load-test/nginx"
# Stop:
#   nginx -c "$(pwd)/load-test/nginx/nginx-hotpath-lb.conf" -p "$(pwd)/load-test/nginx" -s stop

worker_processes auto;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
  worker_connections 4096;
}

http {
  access_log off;
  sendfile on;
  keepalive_timeout 65;
  # High enough for 500 VU create+submit through the proxy.
  keepalive_requests 1000;

  upstream flowsync_api {
    least_conn;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8080;
    server_name localhost;

    location / {
      proxy_pass http://flowsync_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }
  }
}
